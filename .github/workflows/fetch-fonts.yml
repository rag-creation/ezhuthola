# One-off helper: copies the Malayalam sticker fonts (all SIL Open Font License)
# from the Google Fonts repository into the app, with their licence files.
name: Fetch sticker fonts

on:
  push:
    branches: [stickers]
    paths: [.github/workflows/fetch-fonts.yml]

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download fonts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p app/src/main/assets/fonts licenses
          for dir in balooChettan2 manjari chilanka karumbi gayathri; do
            gh api "repos/google/fonts/contents/ofl/$dir" --jq '.[] | select(.name | endswith(".ttf") or . == "OFL.txt") | "\(.name)\t\(.download_url)"' |
            while IFS=$'\t' read -r name url; do
              if [ "$name" = "OFL.txt" ]; then out="licenses/OFL-$dir.txt"; else out="app/src/main/assets/fonts/$(echo "$name" | tr -d '[]' | sed 's/,/-/g')"; fi
              curl -fsSL "$url" -o "$out"
              echo "::notice::$out $(stat -c%s "$out") bytes"
            done
          done
      - name: Commit
        run: |
          git config user.name rag-creation
          git config user.email 240880224+rag-creation@users.noreply.github.com
          git add app/src/main/assets/fonts licenses
          git commit -m "Add Malayalam sticker fonts (SIL Open Font License)"
          git push
