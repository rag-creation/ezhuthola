name: Word check

# Types the most-used Malayalam words into the engine and reports the ones that come out wrong.
# Run it from the Actions tab ("Run workflow"); the report is attached to the run as word-report.
on:
  workflow_dispatch:
    inputs:
      top:
        description: How many of the most-used words to check
        default: "5000"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Run the word check
        env:
          WORD_REPORT: "1"
          WORD_REPORT_TOP: ${{ inputs.top || '5000' }}
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*WordReportTest*'
      - name: Summary
        run: |
          cat app/build/word-report.md >> "$GITHUB_STEP_SUMMARY"
          cat app/build/word-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: word-report
          path: app/build/word-report.md
          retention-days: 30
