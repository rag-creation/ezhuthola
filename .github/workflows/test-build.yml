# Builds a test APK on GitHub, so a branch can be tried on a phone without a computer.
# The test app is "Ezhuthola Test" and installs next to the real Ezhuthola.
name: Test build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build test APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          # One annotation holding every error (GitHub shows at most 10 annotations per step).
          msg=$(grep -E "^e: |What went wrong" -A2 build.log | sed 's#file:///home/runner/work/ezhuthola/ezhuthola/##' | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Build errors::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: Ezhuthola-test-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
