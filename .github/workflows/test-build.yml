# Builds a test APK on GitHub, so a branch can be tried on a phone without a computer.
# The test app is "Ezhuthola Test" and installs next to the real Ezhuthola.
name: Test build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build test APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          # One annotation holding every error (GitHub shows at most 10 annotations per step).
          msg=$(grep -E "^e: |What went wrong" -A2 build.log | sed 's#file:///home/runner/work/ezhuthola/ezhuthola/##' | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Build errors::${msg}"
          # Failing unit tests: name and message, from the test reports.
          fails=$(grep -ho '<testcase name="[^"]*"\|<failure message="[^"]*"' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | grep -B1 '<failure' | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          if [ -n "$fails" ]; then echo "::error title=Failing tests::${fails}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Ezhuthola-test-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Also put the APK on a draft release named "Test build", easy to open on the phone.
      # A draft has no git tag, so F-Droid's update check never sees it.
      - name: Publish test build (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api repos/$GITHUB_REPOSITORY/releases --jq '.[] | select(.draft and .name == "Test build") | .id'); do
            gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/$id
          done
          APK="Ezhuthola-test-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/debug/*.apk "$APK"
          gh release create "test-$GITHUB_REF_NAME-${GITHUB_SHA::7}" "$APK" --draft \
            --target "$GITHUB_SHA" --title "Test build" \
            --notes "Branch $GITHUB_REF_NAME (${GITHUB_SHA::7}). For testing only. Installs as Ezhuthola Test."
