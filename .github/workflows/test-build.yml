# Builds a test APK on GitHub, so a branch can be tried on a phone without a computer.
# The test app is "Ezhuthola Test" and installs next to the real Ezhuthola.
name: Test build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build test APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ezhuthola-test-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
